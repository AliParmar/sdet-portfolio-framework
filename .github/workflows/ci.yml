name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Prepare config.properties
        run: |
          cat <<EOF > src/test/resources/config/config.properties
          base.url=${{ secrets.PARABANK_BASE_URL }}
          api.base.url=${{ secrets.PARABANK_API_BASE_URL }}
          test.username=${{ secrets.PARABANK_USERNAME }}
          test.password=${{ secrets.PARABANK_PASSWORD }}
          browser=chrome
          headless=true
          implicit.wait.seconds=10
          page.load.timeout.seconds=30
          EOF

      - name: Run CI test suite
        run: mvn test -Dsuite=ci

      - name: Upload ExtentReport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-reports/ExtentReport.html